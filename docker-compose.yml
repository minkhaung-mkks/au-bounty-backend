services:
  postgres:
    image: postgres:17-alpine
    container_name: aubounty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aubounty
      POSTGRES_PASSWORD: aubounty
      POSTGRES_DB: aubounty
    ports:
      - "5433:5432"
    volumes:
      - aubounty-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aubounty -d aubounty"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aubounty-pgdata:
